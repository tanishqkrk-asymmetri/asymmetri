name: Vercel Relay

on:
  push:
    branches:
      - main

jobs:
  relay:
    runs-on: ubuntu-latest

    # Only trigger when the pusher is NOT the repo owner
    if: github.actor != 'darshansrc'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT so the push can trigger further workflows / Vercel
          token: ${{ secrets.RELAY_PAT }}
          fetch-depth: 0

      - name: Configure git as owner
        run: |
          git config user.name "Darshan Gowda"
          git config user.email "96766940+darshansrc@users.noreply.github.com"

      - name: Create and push null commit
        run: |
          git commit --allow-empty -m "chore: relay deploy [skip ci]"
          git push origin main
